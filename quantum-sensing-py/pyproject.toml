[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "quantum-sensing"
version = "0.1.0"
description = "Quantum state sensing: dynamics, QFI/CFI, SLD, and state reconstruction"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "qutip>=5.0,<6",
    "pandas>=2.0",
    "h5py",
]

[tool.setuptools.packages.find]
include = ["quantum_sensing*"]
